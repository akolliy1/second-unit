# Build in Cloud Build rather than locally: this machine's Docker daemon is usually down,
# and Cloud Run needs the image in Artifact Registry anyway.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile
      - -t
      - ${_IMAGE}:latest
      - .
images:
  - ${_IMAGE}:latest
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
